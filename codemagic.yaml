 workflows:
  tailor_shop_android:
    name: Tailor Shop Android
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Create Flutter platform files
        script: |
          flutter create . --project-name tailor_shop_manager
          rm -f test/widget_test.dart

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")

          if p.exists():
              s = p.read_text()

              # Change Android app display name
              s = s.replace(
                  'android:label="${applicationName}"',
                  'android:label="Tailor Shop"'
              )

              s = s.replace(
                  'android:label="@string/app_name"',
                  'android:label="Tailor Shop"'
              )

              p.write_text(s)
          PY

      - name: Set Android compile SDK
        script: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          if p.exists():
              s = p.read_text()
              s = s.replace(
                  "compileSdk = flutter.compileSdkVersion",
                  "compileSdk = 36"
              )
              p.write_text(s)
          else:
              p = Path("android/app/build.gradle")
              s = p.read_text()
              s = s.replace(
                  "compileSdk flutter.compileSdkVersion",
                  "compileSdk 36"
              )
              p.write_text(s)
          PY

      - name: Apply platform configuration
        script: |
          dart run tool/apply_platform_config.dart

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Generate app launcher icon
        script: |
          dart run flutter_launcher_icons

      - name: Analyze
        script: |
          flutter analyze || true

      - name: Run tests
        script: |
          flutter test

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
