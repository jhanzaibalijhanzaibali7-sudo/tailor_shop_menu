 workflows:
  tailor_shop_android:
    name: Tailor Shop Android
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Create Flutter platform files
        script: |
          flutter create . --project-name tailor_shop_manager
          rm -f test/widget_test.dart

      - name: Apply platform configuration
        script: |
          dart run tool/apply_platform_config.dart

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Analyze
        script: |
          flutter analyze || true

      - name: Run tests
        script: |
          flutter test

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
