workflows:
  tailor_shop_android:
    name: Tailor Shop Android
    max_build_duration: 60

    environment:
      flutter: stable
      groups:
        - firebase

    scripts:
      - name: Create Flutter platform files
        script: |
          flutter create . --project-name tailor_shop_manager
          rm -f test/widget_test.dart

      - name: Add Firebase configuration
        script: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Configure Google Services plugin
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Configure root Android Gradle file
          root = Path("android/settings.gradle.kts")

          if root.exists():
              s = root.read_text()

              if 'com.google.gms.google-services' not in s:
                  s = s.replace(
                      'plugins {',
                      '''plugins {
              id("com.google.gms.google-services") version "4.4.2" apply false'''
                  )

              root.write_text(s)
          else:
              root = Path("android/settings.gradle")

              s = root.read_text()

              if 'com.google.gms.google-services' not in s:
                  s = s.replace(
                      'pluginManagement {',
                      '''pluginManagement {
          '''
                  )

              root.write_text(s)

          # Configure app Gradle file
          app = Path("android/app/build.gradle.kts")

          if app.exists():
              s = app.read_text()

              if 'com.google.gms.google-services' not in s:
                  s = s.replace(
                      'plugins {',
                      '''plugins {
              id("com.google.gms.google-services")'''
                  )

              app.write_text(s)

          else:
              app = Path("android/app/build.gradle")
              s = app.read_text()

              if 'com.google.gms.google-services' not in s:
                  s = s.replace(
                      'apply plugin:',
                      'apply plugin:'
                  )

                  s = '''apply plugin: 'com.google.gms.google-services'
          ''' + s

              app.write_text(s)

          print("Firebase Google Services plugin configured.")
          PY

      - name: Set Android compile SDK
        script: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          if p.exists():
              s = p.read_text()
              s = s.replace(
                  "compileSdk = flutter.compileSdkVersion",
                  "compileSdk = 36"
              )
              p.write_text(s)
          else:
              p = Path("android/app/build.gradle")
              s = p.read_text()
              s = s.replace(
                  "compileSdk flutter.compileSdkVersion",
                  "compileSdk 36"
              )
              p.write_text(s)
          PY

      - name: Apply platform configuration
        script: |
          dart run tool/apply_platform_config.dart

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Generate app launcher icon
        script: |
          dart run flutter_launcher_icons

      - name: Set final Android app name
        script: |
          python3 - <<'PY'
          from pathlib import Path

          strings_file = Path("android/app/src/main/res/values/strings.xml")

          if strings_file.exists():
              s = strings_file.read_text()

              import re
              s = re.sub(
                  r'<string name="app_name">.*?</string>',
                  '<string name="app_name">Tailor Shop</string>',
                  s
              )

              if 'name="app_name"' not in s:
                  s = s.replace(
                      '</resources>',
                      '    <string name="app_name">Tailor Shop</string>\n</resources>'
                  )

              strings_file.write_text(s)

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if manifest.exists():
              s = manifest.read_text()

              import re

              if 'android:label=' in s:
                  s = re.sub(
                      r'android:label="[^"]*"',
                      'android:label="Tailor Shop"',
                      s,
                      count=1
                  )
              else:
                  s = s.replace(
                      '<application',
                      '<application android:label="Tailor Shop"',
                      1
                  )

              manifest.write_text(s)

          print("Android app name set to: Tailor Shop")
          PY

      - name: Analyze
        script: |
          flutter analyze || true

      - name: Run tests
        script: |
          flutter test

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
